server {
  listen 80;
  root /usr/share/nginx/html;

  # API → gateway (same origin as the app, so the refresh cookie just works).
  location /api/ {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Server-Sent Events: no buffering, long-lived connections.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Hashed build assets can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Client-side routing: unknown paths serve the app.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
