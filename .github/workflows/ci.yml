name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, unit + integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build

  e2e:
    name: End-to-end + double-booking race test
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      NODE_ENV: production
      LOG_LEVEL: warn
      RATE_LIMIT_ENABLED: 'false' # the race test sends hundreds of users from one IP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Start services
        run: |
          for s in auth catalog booking payment notification gateway; do
            (cd services/$s && nohup node dist/index.js > ../../$s.log 2>&1 &)
          done
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/health/services && break
            sleep 2
          done
      - run: npm run e2e
      - run: USERS=100 CHAOS_SECONDS=10 npm run race
      - name: Service logs
        if: failure()
        run: tail -n 100 *.log

  docker:
    name: Docker images build
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, auth, catalog, booking, payment, notification]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          push: false
          tags: showtime-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
